version: '3'

services:
  rabbitmq:
    image: ddocker.io/rabbitmq:4.3-rc-management
    container_name: rabbitmq
    hostname: rabbitmq-server
    restart: always
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      - RABBITMQ_USERNAME=rmq1
      - RABBITMQ_PASSWORD=rmq123
      - RABBITMQ_VHOST=/
      - RABBITMQ_LOGS=-
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
volumes:
  rabbitmq_log:
  rabbitmq_data:
    driver: local
